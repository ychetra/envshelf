[package]
name = "envshelf-connect"
version = "0.1.2"
description = "Local, metadata-only Docker connector for EnvShelf"
authors = ["EnvShelf contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
