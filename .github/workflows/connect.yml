name: EnvShelf Connect

on:
  workflow_dispatch:
  push:
    tags: ['connect-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: ''
          - os: windows-latest
            args: ''
          - os: ubuntu-24.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/connect/package-lock.json
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/connect
        run: npm ci
      - name: Build installer
        working-directory: apps/connect
        run: npm run tauri:build
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: envshelf-connect-${{ matrix.os }}
          path: apps/connect/src-tauri/target/release/bundle
          if-no-files-found: error
